<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="100%">
  <defs>
    <!-- Radiant Golden Sunburst Gradient -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#fff6c2" stop-opacity="0.95" />
      <stop offset="42%" stop-color="#f5b82e" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f5b82e" stop-opacity="0" />
    </radialGradient>

    <!-- Rich Royal Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc" />
      <stop offset="30%" stop-color="#ffd24c" />
      <stop offset="68%" stop-color="#d4941a" />
      <stop offset="100%" stop-color="#8c5806" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#b87b12" />
    </linearGradient>

    <!-- Forged Silver-Steel Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d9e4f0" />
      <stop offset="100%" stop-color="#7f90a6" />
    </linearGradient>

    <!-- Royal Crimson Banner Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3856" />
      <stop offset="55%" stop-color="#c9142c" />
      <stop offset="100%" stop-color="#6b0614" />
    </linearGradient>

    <!-- Alabaster Shield Face -->
    <linearGradient id="ivoryShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#e3d6be" />
    </linearGradient>
  </defs>

  <!-- Background Divine Sunburst Halo & Rays -->
  <circle cx="210" cy="155" r="148" fill="url(#haloGlow)" />

  <!-- 16-Pointed Radiant Sunburst Beams -->
  <g fill="url(#goldGrad)" opacity="0.32">
    <polygon points="210,4 222,125 198,125" />
    <polygon points="210,306 222,185 198,185" />
    <polygon points="45,155 175,143 175,167" />
    <polygon points="375,155 245,143 245,167" />
    <polygon points="92,38 188,136 172,152" />
    <polygon points="328,272 232,174 248,158" />
    <polygon points="328,38 232,136 248,152" />
    <polygon points="92,272 188,174 172,158" />
  </g>

  <!-- Outer Sacred Geometric Rings -->
  <circle cx="210" cy="155" r="118" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.8" />
  <circle cx="210" cy="155" r="104" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.55" />

  <!-- Golden Laurel Wreath of Victory (Left & Right Branches) -->
  <g fill="url(#goldGrad)" stroke="#3d2402" stroke-width="1.2">
    <!-- Left Laurel Leaves -->
    <path d="M112 225 C84 195 76 148 92 104 C102 124 106 164 124 205 Z" opacity="0.85" />
    <path d="M92 185 C74 162 72 132 84 108 C94 128 96 154 105 175 Z" />
    <path d="M104 144 C88 122 92 94 112 72 C116 96 114 120 118 140 Z" />
    <path d="M122 108 C112 86 122 62 146 46 C144 68 136 90 135 108 Z" />
    <!-- Right Laurel Leaves -->
    <path d="M308 225 C336 195 344 148 328 104 C318 124 314 164 296 205 Z" opacity="0.85" />
    <path d="M328 185 C346 162 348 132 336 108 C326 128 324 154 315 175 Z" />
    <path d="M316 144 C332 122 328 94 308 72 C304 96 306 120 302 140 Z" />
    <path d="M298 108 C308 86 298 62 274 46 C276 68 284 90 285 108 Z" />
  </g>

  <!-- Twin Crossed Royal Broadswords Behind Shield -->
  <g stroke="#1b1207" stroke-width="3" stroke-linejoin="round">
    <!-- Left-to-Right Sword -->
    <polygon points="62,28 88,34 315,261 296,280 69,53" fill="url(#bladeGrad)" />
    <line x1="76" y1="42" x2="294" y2="260" stroke="#ffffff" stroke-width="2.2" />
    <path d="M268 286 L322 232" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" />
    <path d="M298 264 L334 300" stroke="#7a1222" stroke-width="12" stroke-linecap="round" />
    <circle cx="342" cy="308" r="10" fill="url(#goldGrad)" />

    <!-- Right-to-Left Sword -->
    <polygon points="358,28 332,34 105,261 124,280 351,53" fill="url(#bladeGrad)" />
    <line x1="344" y1="42" x2="126" y2="260" stroke="#ffffff" stroke-width="2.2" />
    <path d="M98 232 L152 286" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" />
    <path d="M122 264 L86 300" stroke="#7a1222" stroke-width="12" stroke-linecap="round" />
    <circle cx="78" cy="308" r="10" fill="url(#goldGrad)" />
  </g>

  <!-- Center Purified Heraldic Heater Shield -->
  <path
    d="M132 82 H288 V162 C288 218 210 264 210 264 C210 264 132 218 132 162 Z"
    fill="url(#ivoryShield)"
    stroke="url(#goldGrad)"
    stroke-width="8"
    stroke-linejoin="round"
  />
  <path
    d="M144 93 H276 V159 C276 206 210 247 210 247 C210 247 144 206 144 159 Z"
    fill="none"
    stroke="#b88928"
    stroke-width="2"
    opacity="0.65"
  />

  <!-- Four Purified Suits Quartered on the Heraldic Shield -->
  <!-- Quarter Dividers -->
  <line x1="210" y1="94" x2="210" y2="245" stroke="#cbb994" stroke-width="2" />
  <line x1="145" y1="164" x2="275" y2="164" stroke="#cbb994" stroke-width="2" />

  <!-- Top-Left: Hearts (Red) -->
  <path
    d="M178 148 C178 148 159 135 159 121 C159 114 164.5 110 170.5 110 C174.5 110 176.8 112.4 178 115.2 C179.2 112.4 181.5 110 185.5 110 C191.5 110 197 114 197 121 C197 135 178 148 178 148 Z"
    fill="#d91b2e"
  />
  <!-- Top-Right: Spades (Black) -->
  <path
    d="M242 108 C242 108 224 122 224 133 C224 138.8 228.5 142.8 233.8 142.8 C236.8 142.8 239.2 141.2 240.4 139 L235.5 149 H248.5 L243.6 139 C244.8 141.2 247.2 142.8 250.2 142.8 C255.5 142.8 260 138.8 260 133 C260 122 242 108 242 108 Z"
    fill="#141418"
  />
  <!-- Bottom-Left: Clubs (Black) -->
  <path
    d="M178 174 C173 174 169 178 169 183 C169 185.3 170 187.4 171.5 188.9 C170 188.3 168.4 188 166.7 188 C161.7 188 157.7 192 157.7 197 C157.7 202 161.7 206 166.7 206 C170.5 206 173.8 203.6 175 200.2 L171 212 H185 L181 200.2 C182.2 203.6 185.5 206 189.3 206 C194.3 206 198.3 202 198.3 197 C198.3 192 194.3 188 189.3 188 C187.6 188 186 188.3 184.5 188.9 C186 187.4 187 185.3 187 183 C187 178 183 174 178 174 Z"
    fill="#141418"
  />
  <!-- Bottom-Right: Diamonds (Red) -->
  <path
    d="M242 173 C246 181 251.5 188 259 193.5 C251.5 199 246 206 242 214 C238 206 232.5 199 225 193.5 C232.5 188 238 181 242 173 Z"
    fill="#d91b2e"
  />

  <!-- Grand Imperial Golden Crown Sitting Atop the Shield -->
  <g stroke="#291702" stroke-width="3.6" stroke-linejoin="round">
    <path
      d="M120 96 L106 36 L160 66 L210 14 L260 66 L314 36 L300 96 Z"
      fill="url(#goldLight)"
    />
    <!-- Crimson Velvet Crown Band -->
    <rect x="120" y="92" width="180" height="22" rx="6" fill="url(#crimsonGrad)" />
    <!-- Crown Jewels -->
    <polygon points="210,46 221,64 210,82 199,64" fill="#ff2a4b" stroke="#fff2d6" stroke-width="2" />
    <circle cx="152" cy="72" r="8" fill="#22e66b" stroke="#fff2d6" stroke-width="2" />
    <circle cx="268" cy="72" r="8" fill="#22e66b" stroke="#fff2d6" stroke-width="2" />
    <!-- Base Band Gems -->
    <circle cx="148" cy="103" r="4.5" fill="#fff6cc" stroke="none" />
    <circle cx="178" cy="103" r="4.5" fill="#fff6cc" stroke="none" />
    <circle cx="210" cy="103" r="5.5" fill="#22e66b" stroke="#fff" stroke-width="1.5" />
    <circle cx="242" cy="103" r="4.5" fill="#fff6cc" stroke="none" />
    <circle cx="272" cy="103" r="4.5" fill="#fff6cc" stroke="none" />
  </g>

  <!-- Floating Sacred Sparkles -->
  <g fill="#fff8d6">
    <polygon points="56,74 60,84 70,88 60,92 56,102 52,92 42,88 52,84" />
    <polygon points="364,74 368,84 378,88 368,92 364,102 360,92 350,88 360,84" />
    <polygon points="210,276 213,284 221,287 213,290 210,298 207,290 199,287 207,284" />
  </g>
</svg>
